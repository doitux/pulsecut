name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (core, fuzz, export, UI de/en)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg melt fonts-dejavu-core
      - name: Python packages
        run: |
          pip install numpy pytest playwright ruff
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check --select E9,F63,F7,F82,F821,F823 pulsecut tests tools packaging
      - name: Translations complete
        run: python tools/i18n_keys.py
      - name: Synthetic test media (cached)
        uses: actions/cache@v4
        with:
          path: tests/.data
          key: testdata-${{ hashFiles('tests/gen_clips.py', 'tests/gen_music.py') }}-${{ hashFiles('pulsecut/video.py', 'pulsecut/musik.py') }}
          restore-keys: testdata-${{ hashFiles('tests/gen_clips.py', 'tests/gen_music.py') }}-
      - name: Core, fuzz and export tests
        env:
          PULSECUT_FUZZ_STEPS: "300"
          PULSECUT_FUZZ_SEEDS: "1,2,3"
        run: python -m pytest -m "not ui and not ki" -v --durations=15
      - name: Browser tests (German and English)
        env:
          PULSECUT_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: python -m pytest tests/test_ui.py -v
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 14

  appimage:
    name: AppImage (build + smoke test)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - name: git for checkout
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Build
        run: packaging/ci_build.sh
      - name: Smoke test (server, whole project, export, Qt window)
        env:
          SMOKE_SCREENSHOT: dist/window.png
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python3 tests/smoke_appimage.py dist/Pulsecut-*-x86_64.AppImage --gui
      - uses: actions/upload-artifact@v4
        with:
          name: Pulsecut-AppImage
          path: |
            dist/Pulsecut-*-x86_64.AppImage
            dist/SHA256SUMS
            dist/window.png
          retention-days: 14
